<style>

#txt.out{opacity:0;transform:scale(1.03)}
#txt.lit{text-shadow:0 0 30px rgba(255,200,170,.8)}
#txt.fin{font-size:clamp(2.4rem,1.4rem + 8vmin,5rem);color:#fff;text-shadow:0 0 40px rgba(255,210,170,.8)}
.ln{display:block;margin:.35em 0}
.w{display:inline-block;white-space:nowrap}
.w b{font-weight:400;display:inline-block;opacity:0;animation:wr .9s ease forwards}
@keyframes wr{from{opacity:0;filter:blur(6px);transform:translateY(.25em)}to{opacity:1;filter:none;transform:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#nm{display:none;font:italic 400 clamp(2.8rem,13vmin,5.6rem)/1.1 'Snell Roundhand','Segoe Script','Brush Script MT','Apple Chancery','Lucida Handwriting',cursive;color:rgba(255,244,230,.17);text-align:center;transition:color 1.6s,text-shadow 1.6s}

#hint{--p:0;position:absolute;left:0;right:0;bottom:calc(var(--sb) + 76px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 24px;pointer-events:none;opacity:0;transition:opacity 1s;font:600 clamp(.72rem,.62rem + .9vmin,.9rem)/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-align:center;color:rgba(255,244,230,.85);filter:drop-shadow(0 0 calc(var(--p)*14px) rgba(232,194,122,.9))}

.hi{position:relative;width:76px;height:44px}

.hi.P i{animation-name:sp}.hi.P i:first-child{--x:-26px}.hi.P i:last-child{--x:26px}

.hi.DT::after{animation-duration:1.4s}.hi.T::after{animation-duration:1.6s}
@keyframes rg{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.3);opacity:0}}
.hi.W i{--x:0;animation:wg 1.2s ease-in-out infinite alternate}

.hi.K::before{content:'';position:absolute;left:50%;top:50%;width:16px;height:28px;margin:-14px -8px;border:2px solid var(--g);border-radius:4px;animation:shk .7s infinite}

.hi svg path{fill:none;stroke:var(--g);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:1;animation:dr 2.6s ease-in-out infinite}

button{font:inherit;color:var(--iv);background:none;border:0;opacity:.6;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;touch-action:manipulation}

#ctl{position:absolute;top:calc(var(--sa) + 8px);right:calc(var(--sr) + 8px);display:flex;gap:2px;z-index:5}
#btn{position:absolute;left:50%;bottom:calc(var(--sb) + 18px);transform:translateX(-50%);width:auto;height:44px;padding:0 24px;border:1px solid rgba(232,194,122,.55);border-radius:22px;font:600 .8rem system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.92;z-index:5}
#btn[hidden]{display:none}
#pg{position:absolute;top:var(--sa);left:0;right:0;height:2px;background:rgba(255,255,255,.08)}
#pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--g));transition:width 1.2s ease}
#sn.pulse{animation:pl 2.2s ease-in-out infinite}@keyframes pl{50%{opacity:1;transform:scale(1.18)}}
@media (max-height:460px){#stage{padding-top:calc(var(--sa) + 40px);padding-bottom:calc(var(--sb) + 104px)}#txt{font-size:clamp(1.05rem,5.2vh,1.8rem)}#hint{bottom:calc(var(--sb) + 52px);gap:2px}.hi{transform:scale(.7);height:34px}#nm{font-size:clamp(1.8rem,10vh,3.4rem)}}
@media (prefers-reduced-motion:reduce){.w b{animation-duration:.01s;animation-delay:0s!important}.hi,.hi i,.hi svg path,.hi::after,.hi::before,#hint.no,#sn.pulse{animation:none!important}.hi i{opacity:1}.hi.P i:first-child{transform:translateX(-14px)}.hi.P i:last-child{transform:translateX(14px)}#txt,.sky{transition-duration:.2s}}
</style></head>
<body>
<main id="app">
<div class="sky" id="k0"></div><div class="sky" id="k1"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="fl" aria-hidden="true"></div>
<svg id="ring" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" pathLength="1" transform="rotate(-90 40 40)"/></svg>
<div id="stage"><p id="txt" aria-live="polite"></p><div id="nm"></div></div>
<div id="hint"><div class="hi"></div><span id="ht"></span><small id="hs"></small></div>

<button id="bk" aria-label="Previous scene">‹</button>

<button id="rs" aria-label="Restart" title="Restart">↺</button>
</nav>
<div id="pg"><i></i></div>
</main>

{g:'L',h:['← Swipe left','← Drag left'],t:['I wish I could close every distance between us.'],bg:'linear-gradient(#0a0414,#2a0a26 80%,#4a0f2e)',tr:'ripple',
 init(){ps=dust(PCN*.4,1)},draw(dt){const y=H*.3;let d=W*.34*(1-.45*clamp(T/30,0,1));if(S.col){S.c=Math.min(1,(S.c||0)+dt*1.4);d*=1-ease(S.c);if(S.c>=1&&!S.rp){S.rp=1;rp.push({x:W/2,y,r:0,a:1},{x:W/2,y,r:-60,a:.8});flash(.4,'#ffd9a0')}}

{g:'O',s:'or circle with one finger',h:['⟳ Rotate two fingers clockwise','⟳ Drag in a clockwise circle'],t:['Somehow, you keep finding your way into every thought.'],bg:'linear-gradient(#030314,#150a3a 60%,#2a0f4a)',tr:'constel',
 init(){ps=[];S.st=Array.from({length:70},()=>({r:20+Math.sqrt(R())*Math.hypot(W,H)*.5,th:R()*TAU,s:5+R()*9,f:R()*3}))},
